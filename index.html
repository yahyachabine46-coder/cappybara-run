        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
        }
        body {
            background-color: #f7f7f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 12px;
            touch-action: manipulation;
            user-select: none;
        }
        h1 {
            color: #3c1e07;
            margin-bottom: 8px;
            font-size: clamp(20px, 4vw, 28px);
            text-align: center;
        }
        #hint {
            color: #6b4a2b;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: center;
        }
        #stage {
            width: 100%;
            max-width: 1100px;
        }
        #game-container {
            width: 100%;
            aspect-ratio: 800 / 250;
            max-height: 344px;
            background: linear-gradient(to bottom, #c6f7ff 75%, #b2ebf2 75%);
            border-bottom: 6px solid #3c1e07;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        /* --- DESIGN DU CAPYBARA --- */
        #capybara {
            width: 9%;
            height: 23.2%;
            min-width: 40px;
            min-height: 32px;
            background-color: #d7995b;
            border: 4px solid #3c1e07;
            border-radius: 38px 48px 24px 28px;
            position: absolute;
            bottom: 25.2%;
            left: 6.25%;
            z-index: 5;
        }
        #capybara::before {
            content: '';
            position: absolute;
            top: -2px;
            right: -14px;
            width: 32px;
            height: 38px;
            background-color: #8d532a;
            border: 4px solid #3c1e07;
            border-radius: 12px 18px 16px 12px;
        }
        #capybara::after {
            content: '〃';
            font-weight: bold;
            color: #3c1e07;
            font-size: 15px;
            position: absolute;
            left: -12px;
            top: 24px;
            transform: rotate(-30deg);
        }
        #capybara-details {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .back-hair {
            position: absolute;
            top: -12px;
            left: 18px;
            font-size: 12px;
            color: #3c1e07;
            font-weight: bold;
            transform: rotate(10deg);
        }
        .blush {
            position: absolute;
            top: 18px;
            right: 2px;
            width: 13px;
            height: 11px;
            background-color: #ff6b6b;
            border-radius: 50%;
            z-index: 3;
        }
        .eye {
            position: absolute;
            top: 10px;
            right: 8px;
            width: 9px;
            height: 4px;
            background-color: #3c1e07;
            border-radius: 2px;
            z-index: 4;
        }
        .ear {
            position: absolute;
            top: -16px;
            right: 22px;
            width: 14px;
            height: 18px;
            background-color: #8d532a;
            border: 4px solid #3c1e07;
            border-radius: 50% 50% 20% 20%;
            z-index: 2;
        }
        .head-hair {
            position: absolute;
            top: -16px;
            right: -6px;
            font-size: 12px;
            color: #3c1e07;
            font-weight: bold;
            transform: rotate(15deg);
        }
        .orange {
            position: absolute;
            top: -26px;
            right: -2px;
            width: 22px;
            height: 20px;
            background-color: #ff9800;
            border: 3px solid #3c1e07;
            border-radius: 50%;
            z-index: 10;
        }
        .orange::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 6px;
            width: 6px;
            height: 6px;
            background-color: #4caf50;
            border: 2px solid #3c1e07;
            border-radius: 0 8px 0 8px;
        }
        .leg {
            position: absolute;
            bottom: -15px;
            width: 13px;
            height: 16px;
            background-color: #3c1e07;
            border-radius: 0 0 6px 6px;
        }
        .leg-front { right: 8px; }
        .leg-back { left: 14px; }

        .running .leg-front {
            animation: legSwing 0.12s infinite alternate ease-in-out;
        }
        .running .leg-back {
            animation: legSwing 0.12s infinite alternate-reverse ease-in-out;
        }
        @keyframes legSwing {
            0% { transform: translateY(0) rotate(-15deg); }
            100% { transform: translateY(-3px) rotate(15deg); }
        }

        /* --- OBSTACLE : LE CROCODILE --- */
        .alligator {
            width: 168px;
            height: 32px;
            background-image: var(--crocodile-img);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            bottom: 25.2%;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
            transform: scaleX(-1);
        }

        /* --- OBSTACLE : LE GUÉPARD (à partir de 20000 points) --- */
        .cheetah {
            width: 74px;
            height: 44px;
            background-color: #f0b94d;
            border: 4px solid #3c1e07;
            border-radius: 30px 40px 22px 26px;
            position: absolute;
            bottom: 25.2%;
            z-index: 4;
        }
        .cheetah::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -16px;
            width: 30px;
            height: 32px;
            background-color: #f0b94d;
            border: 4px solid #3c1e07;
            border-radius: 16px 10px 10px 16px;
        }
        .cheetah-details {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .cheetah-ear {
            position: absolute;
            top: -13px;
            width: 12px;
            height: 14px;
            background-color: #f0b94d;
            border: 3px solid #3c1e07;
            border-radius: 50% 50% 10% 10%;
            z-index: 2;
        }
        .cheetah-ear-1 { left: -10px; }
        .cheetah-ear-2 { left: 2px; }
        .cheetah-eye {
            position: absolute;
            top: 6px;
            left: -8px;
            width: 8px;
            height: 4px;
            background-color: #3c1e07;
            border-radius: 2px;
            z-index: 4;
        }
        .cheetah-tear {
            position: absolute;
            top: 10px;
            left: -12px;
            width: 2px;
            height: 9px;
            background-color: #3c1e07;
            transform: rotate(15deg);
            z-index: 4;
        }
        .cheetah-blush {
            position: absolute;
            top: 16px;
            left: -14px;
            width: 10px;
            height: 8px;
            background-color: #ff8f6b;
            border-radius: 50%;
            opacity: 0.8;
            z-index: 3;
        }
        .cheetah-spot {
            position: absolute;
            width: 7px;
            height: 7px;
            background-color: #3c1e07;
            border-radius: 50%;
            opacity: 0.85;
        }
        .cheetah-spot.s1 { top: 4px; left: 18px; }
        .cheetah-spot.s2 { top: 18px; left: 12px; }
        .cheetah-spot.s3 { top: 6px; left: 34px; }
        .cheetah-spot.s4 { top: 20px; left: 30px; }
        .cheetah-spot.s5 { top: 4px; left: 48px; }
        .cheetah-tail {
            position: absolute;
            top: 8px;
            right: -18px;
            width: 22px;
            height: 8px;
            background-color: #f0b94d;
            border: 3px solid #3c1e07;
            border-radius: 10px;
            transform: rotate(-18deg);
            z-index: 1;
        }
        .cheetah-tail::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -2px;
            width: 8px;
            height: 8px;
            background-color: #3c1e07;
            border-radius: 50%;
        }
        .cheetah-leg {
            position: absolute;
            bottom: -14px;
            width: 10px;
            height: 15px;
            background-color: #3c1e07;
            border-radius: 0 0 5px 5px;
        }
        .cheetah-leg-front { left: 16px; }
        .cheetah-leg-back { right: 16px; }
        .cheetah.running .cheetah-leg-front {
            animation: legSwing 0.08s infinite alternate ease-in-out;
        }
        .cheetah.running .cheetah-leg-back {
            animation: legSwing 0.08s infinite alternate-reverse ease-in-out;
        }

        /* --- INTERFACE --- */
        #ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-weight: bold;
            color: #3c1e07;
            font-size: clamp(14px, 3vw, 18px);
        }
        #game-over, #start-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 12px;
            border: 4px solid #3c1e07;
            z-index: 10;
            width: min(85%, 320px);
        }
        #start-screen { display: block; }
        #game-over h2, #start-screen h2 {
            font-size: clamp(16px, 4vw, 20px);
        }
        #game-over p, #start-screen p {
            font-size: clamp(12px, 3vw, 14px);
            margin-top: 4px;
        }
        #game-over button, #start-screen button {
            margin-top: 12px;
            padding: 10px 22px;
            background-color: #d7995b;
            color: #3c1e07;
            border: 3px solid #3c1e07;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        #game-over button:hover, #start-screen button:hover {
            background-color: #8d532a;
            color: white;
        }
        #game-over button:active, #start-screen button:active {
            transform: scale(0.96);
        }
        footer {
            margin-top: 10px;
            font-size: 11px;
            color: #9a8060;
        }
        #credit {
            position: fixed;
            bottom: 10px;
            left: 12px;
            font-size: 12px;
            color: #6b4a2b;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 9px;
            border-radius: 8px;
            z-index: 20;
        }
        @media (max-width: 480px) {
            #hint { font-size: 12px; }
        }

        /* --- COMPTE / SYNC --- */
        #auth-panel, #auth-panel-loggedin {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            border: 3px solid #3c1e07;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #3c1e07;
        }
        #auth-panel-loggedin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        #auth-form {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        #auth-form input {
            padding: 6px 8px;
            border: 2px solid #3c1e07;
            border-radius: 6px;
            font-size: 13px;
            width: 150px;
            max-width: 40vw;
        }
        #auth-panel button {
            padding: 6px 10px;
            background-color: #d7995b;
            color: #3c1e07;
            border: 2px solid #3c1e07;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        #auth-panel button:hover {
            background-color: #8d532a;
            color: #fff;
        }
        #auth-panel button.link-btn {
            background: none;
            border: none;
            text-decoration: underline;
            color: #6b4a2b;
            font-weight: normal;
            padding: 4px;
        }
        #auth-status {
            font-size: 12px;
            min-height: 16px;
            width: 100%;
        }
        #auth-status.error { color: #c0392b; }
        #auth-status.success { color: #1b5e20; }
    </style>
</head>
<body>

    <h1>Cute Capybara Run! 🍊</h1>
    <div id="hint">Espace / ↑ / Tap pour sauter</div>

    <div id="auth-panel">
        <form id="auth-form">
            <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="auth-password" placeholder="Mot de passe" autocomplete="current-password" required minlength="6">
            <button id="signin-btn" type="submit">Se connecter</button>
            <button id="signup-btn" type="button">Créer un compte</button>
            <button id="guest-btn" type="button" class="link-btn">Jouer sans compte</button>
        </form>
        <div id="auth-status"></div>
    </div>

    <div id="auth-panel-loggedin" style="display:none;">
        <span id="auth-user-label">Connecté</span>
        <button id="signout-btn" type="button">Se déconnecter</button>
    </div>

    <div id="stage">
        <div id="game-container">
            <div id="capybara" class="running">
                <div id="capybara-details">
                    <div class="orange"></div>
                    <div class="ear"></div>
                    <div class="head-hair">′′</div>
                    <div class="back-hair">′</div>
                    <div class="eye"></div>
                    <div class="blush"></div>
                    <div class="leg leg-front"></div>
                    <div class="leg leg-back"></div>
                </div>
            </div>

            <div id="start-screen">
                <h2>Cute Capybara Run! 🍊</h2>
                <p>Évite les crocodiles, va vite !</p>
                <button id="play-btn" type="button">Jouer</button>
            </div>

            <div id="game-over">
                <h2>Game Over !</h2>
                <p>Le crocodile vous a attrapé.</p>
                <button id="restart-btn" type="button">Recommencer</button>
            </div>
        </div>

        <div id="ui">
            <div id="score-box">Score: <span id="score">0</span></div>
            <div id="high-score-box">Meilleur Score: <span id="high-score">0</span></div>
        </div>
    </div>

    <footer>Astuce : maintiens le saut appuyé pour sauter plus haut.</footer>
    <div id="credit">Made by Yahya &amp; Claude</div>

    <!--
        SYNC MULTI-APPAREILS (optionnel)
        =================================
        Ce jeu peut synchroniser le meilleur score entre appareils via Firebase
        (gratuit). Sans configuration, le jeu fonctionne quand même : le score
        est juste sauvegardé localement sur chaque appareil (comme avant).

        Pour activer la synchronisation :
        1. Va sur https://console.firebase.google.com et crée un projet gratuit.
        2. Dans le projet : Authentication > Sign-in method > active "Email/Password".
        3. Toujours dans le projet : Firestore Database > créer une base
           (mode "test" suffit pour démarrer).
        4. Project settings > tes applications > "</> Web" > copie l'objet
           firebaseConfig qui s'affiche, et colle-le ci-dessous à la place de
           celui qui commence par "YOUR_API_KEY".
    -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script>
        // Remplace ces valeurs par celles de TON projet Firebase (voir instructions au-dessus).
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
    </script>

    <script>
        (function () {
            const capybara = document.getElementById("capybara");
            const container = document.getElementById("game-container");
            const scoreDisplay = document.getElementById("score");
            const highScoreDisplay = document.getElementById("high-score");
            const gameOverScreen = document.getElementById("game-over");
            const startScreen = document.getElementById("start-screen");
            const playBtn = document.getElementById("play-btn");
            const restartBtn = document.getElementById("restart-btn");

            let GROUND_Y = 63; // px, recalculated from actual container height (25.2% of it)

            let positionY = GROUND_Y;
            let velocityY = 0;
            const gravity = 0.48;
            const jumpForce = 15.5;
            let isHoldingJump = false;

            let isRunning = false;
            let isGameOver = false;
            let score = 0;
            let highScore = 0;
            let obstacles = [];
            let gameSpeed = 6.5;
            const maxGameSpeed = 16;
            let spawnTimer = 0;
            let nextSpawnAt = 70;
            let animationFrameId = null;
            let containerWidth = 800;
            let containerHeight = 250;

            const CAP_LEFT_RATIO = 0.0625; // matches left: 6.25%
            const CAP_WIDTH_RATIO = 0.09;
            const CAP_HEIGHT_RATIO = 0.232;

            // --- Auth / cloud sync elements ---
            const authPanel = document.getElementById("auth-panel");
            const authPanelLoggedIn = document.getElementById("auth-panel-loggedin");
            const authForm = document.getElementById("auth-form");
            const authEmail = document.getElementById("auth-email");
            const authPassword = document.getElementById("auth-password");
            const signinBtn = document.getElementById("signin-btn");
            const signupBtn = document.getElementById("signup-btn");
            const guestBtn = document.getElementById("guest-btn");
            const signoutBtn = document.getElementById("signout-btn");
            const authStatus = document.getElementById("auth-status");
            const authUserLabel = document.getElementById("auth-user-label");

            let auth = null;
            let db = null;
            let currentUser = null;
            let cloudEnabled = false;

            function setAuthStatus(message, type) {
                authStatus.textContent = message || "";
                authStatus.className = type || "";
            }

            function showLoggedInUI(email) {
                authPanel.style.display = "none";
                authPanelLoggedIn.style.display = "flex";
                authUserLabel.textContent = "Connecté : " + email + " (score synchronisé)";
            }

            function showLoggedOutUI() {
                authPanelLoggedIn.style.display = "none";
                authPanel.style.display = "block";
            }

            // --- Persisted high score (local fallback, always used as a base) ---
            try {
                const saved = localStorage.getItem("capybaraRunHighScore");
                if (saved) {
                    highScore = parseInt(saved, 10) || 0;
                    highScoreDisplay.innerText = highScore;
                }
            } catch (e) { /* localStorage unavailable, ignore */ }

            function saveHighScoreLocal() {
                try {
                    localStorage.setItem("capybaraRunHighScore", String(highScore));
                } catch (e) { /* ignore */ }
            }

            async function pushHighScoreToCloud() {
                if (!cloudEnabled || !currentUser || !db) return;
                try {
                    await db.collection("capybaraRunScores").doc(currentUser.uid).set({
                        highScore: highScore,
                        email: currentUser.email,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Cloud sync failed:", e);
                }
            }

            async function pullHighScoreFromCloud() {
                if (!cloudEnabled || !currentUser || !db) return;
                try {
                    const docSnap = await db.collection("capybaraRunScores").doc(currentUser.uid).get();
                    const cloudScore = docSnap.exists ? (docSnap.data().highScore || 0) : 0;
                    if (cloudScore > highScore) {
                        highScore = cloudScore;
                        highScoreDisplay.innerText = highScore;
                        saveHighScoreLocal();
                    } else if (highScore > cloudScore) {
                        await pushHighScoreToCloud();
                    }
                } catch (e) {
                    console.warn("Cloud fetch failed:", e);
                }
            }

            function saveHighScore() {
                saveHighScoreLocal();
                pushHighScoreToCloud();
            }

            // --- Firebase init (only if the config above has been filled in) ---
            function initFirebaseIfConfigured() {
                if (typeof firebase === "undefined") return; // SDK failed to load (e.g. offline)
                if (!firebaseConfig || firebaseConfig.apiKey === "YOUR_API_KEY") {
                    // Not configured: hide the account panel entirely, local-only mode.
                    authPanel.style.display = "none";
                    authPanelLoggedIn.style.display = "none";
                    return;
                }
                try {
                    firebase.initializeApp(firebaseConfig);
                    auth = firebase.auth();
                    db = firebase.firestore();
                    cloudEnabled = true;

                    auth.onAuthStateChanged(function (user) {
                        currentUser = user;
                        if (user) {
                            showLoggedInUI(user.email);
                            pullHighScoreFromCloud();
                        } else {
                            showLoggedOutUI();
                        }
                    });
                } catch (e) {
                    console.warn("Firebase init failed:", e);
                    authPanel.style.display = "none";
                    authPanelLoggedIn.style.display = "none";
                }
            }
            initFirebaseIfConfigured();

            authForm.addEventListener("submit", function (e) {
                e.preventDefault();
                if (!cloudEnabled) return;
                setAuthStatus("Connexion en cours…", "");
                auth.signInWithEmailAndPassword(authEmail.value, authPassword.value)
                    .then(function () { setAuthStatus("", ""); })
                    .catch(function (err) { setAuthStatus(translateAuthError(err), "error"); });
            });

            signupBtn.addEventListener("click", function () {
                if (!cloudEnabled) return;
                setAuthStatus("Création du compte…", "");
                auth.createUserWithEmailAndPassword(authEmail.value, authPassword.value)
                    .then(function () { setAuthStatus("Compte créé !", "success"); })
                    .catch(function (err) { setAuthStatus(translateAuthError(err), "error"); });
            });

            guestBtn.addEventListener("click", function () {
                authPanel.style.display = "none";
            });

            signoutBtn.addEventListener("click", function () {
                if (auth) auth.signOut();
            });

            function translateAuthError(err) {
                switch (err.code) {
                    case "auth/email-already-in-use": return "Cet email a déjà un compte, connecte-toi plutôt.";
                    case "auth/invalid-email": return "Email invalide.";
                    case "auth/weak-password": return "Mot de passe trop court (6 caractères min).";
                    case "auth/wrong-password":
                    case "auth/user-not-found":
                    case "auth/invalid-credential": return "Email ou mot de passe incorrect.";
                    default: return "Erreur : " + err.message;
                }
            }

            function updateContainerWidth() {
                const rect = container.getBoundingClientRect();
                containerWidth = rect.width || 800;
                containerHeight = rect.height || 250;
                const wasAtGround = positionY === GROUND_Y;
                GROUND_Y = containerHeight * 0.252;
                if (wasAtGround) {
                    positionY = GROUND_Y;
                    capybara.style.bottom = GROUND_Y + "px";
                }
            }
            window.addEventListener("resize", updateContainerWidth);
            updateContainerWidth();

            function jump() {
                if (positionY === GROUND_Y && !isGameOver && isRunning) {
                    velocityY = jumpForce;
                    isHoldingJump = true;
                    capybara.classList.remove("running");
                }
            }

            function handlePrimaryAction() {
                if (!isRunning && !isGameOver) {
                    startGame();
                    return;
                }
                if (isGameOver) return;
                jump();
            }

            document.addEventListener("keydown", function (event) {
                if (event.code === "Space" || event.code === "ArrowUp") {
                    event.preventDefault();
                    handlePrimaryAction();
                }
                if (event.code === "Enter" && isGameOver) {
                    resetGame();
                }
            });

            document.addEventListener("keyup", function (event) {
                if (event.code === "Space" || event.code === "ArrowUp") {
                    isHoldingJump = false;
                }
            });

            container.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                handlePrimaryAction();
            });
            container.addEventListener("pointerup", function () {
                isHoldingJump = false;
            });
            container.addEventListener("pointercancel", function () {
                isHoldingJump = false;
            });

            playBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                startGame();
            });
            restartBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                resetGame();
            });

            function updatePhysics() {
                if (!isHoldingJump && velocityY > 4) {
                    velocityY = 4;
                }

                velocityY -= gravity;
                positionY += velocityY;

                if (positionY <= GROUND_Y) {
                    positionY = GROUND_Y;
                    velocityY = 0;
                    if (!isGameOver) capybara.classList.add("running");
                }

                capybara.style.bottom = positionY + "px";
            }

            const CHEETAH_SCORE_THRESHOLD = 20000;

            function createObstacle() {
                const useCheetah = score >= CHEETAH_SCORE_THRESHOLD;
                let el = document.createElement("div");

                if (useCheetah) {
                    el.className = "cheetah running";
                    el.innerHTML =
                        '<div class="cheetah-details">' +
                        '<div class="cheetah-ear cheetah-ear-1"></div>' +
                        '<div class="cheetah-ear cheetah-ear-2"></div>' +
                        '<div class="cheetah-eye"></div>' +
                        '<div class="cheetah-tear"></div>' +
                        '<div class="cheetah-blush"></div>' +
                        '<div class="cheetah-spot s1"></div>' +
                        '<div class="cheetah-spot s2"></div>' +
                        '<div class="cheetah-spot s3"></div>' +
                        '<div class="cheetah-spot s4"></div>' +
                        '<div class="cheetah-spot s5"></div>' +
                        '<div class="cheetah-tail"></div>' +
                        '<div class="cheetah-leg cheetah-leg-front"></div>' +
                        '<div class="cheetah-leg cheetah-leg-back"></div>' +
                        '</div>';
                } else {
                    el.classList.add("alligator");
                }

                el.style.left = containerWidth + "px";
                container.appendChild(el);
                obstacles.push({ element: el, left: containerWidth, type: useCheetah ? "cheetah" : "crocodile" });
            }

            function checkCollision(obsLeft, type) {
                let obsWidth, obsHeight, obsHitLeft, obsHitRight;

                if (type === "cheetah") {
                    obsWidth = 74;
                    obsHeight = 44;
                    obsHitLeft = obsLeft + obsWidth * 0.06;
                    obsHitRight = obsLeft + obsWidth * 0.94;
                } else {
                    obsWidth = 168;
                    obsHeight = 32;
                    // The crocodile image has generous transparent padding, so shrink
                    // the effective hitbox in from both edges for fairer collisions.
                    obsHitLeft = obsLeft + obsWidth * 0.12;
                    obsHitRight = obsLeft + obsWidth * 0.9;
                }

                const obsBottom = 63;
                const obsTop = obsBottom + obsHeight;

                const capWidth = containerWidth * CAP_WIDTH_RATIO;
                const capHeight = containerHeight * CAP_HEIGHT_RATIO;
                const capLeft = containerWidth * CAP_LEFT_RATIO;
                const capRight = capLeft + capWidth - 15;
                const capBottom = positionY;
                const capTop = positionY + capHeight - 8;

                const horizontalOverlap = capRight > obsHitLeft && capLeft < obsHitRight;
                const verticalOverlap = capBottom < obsTop && capTop > obsBottom;

                return horizontalOverlap && verticalOverlap;
            }

            function gameLoop() {
                if (isGameOver || !isRunning) return;

                updatePhysics();

                score++;
                scoreDisplay.innerText = score;

                if (score % 400 === 0 && gameSpeed < maxGameSpeed) {
                    gameSpeed += 0.5;
                }

                spawnTimer++;
                if (spawnTimer > nextSpawnAt) {
                    createObstacle();
                    spawnTimer = 0;
                    nextSpawnAt = Math.random() * 55 + 65;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.left -= gameSpeed;
                    obs.element.style.left = obs.left + "px";

                    if (checkCollision(obs.left, obs.type)) {
                        endGame();
                        return;
                    }

                    if (obs.left < -180) {
                        obs.element.remove();
                        obstacles.splice(i, 1);
                    }
                }

                animationFrameId = requestAnimationFrame(gameLoop);
            }

            function startGame() {
                updateContainerWidth();
                startScreen.style.display = "none";
                gameOverScreen.style.display = "none";
                isRunning = true;
                isGameOver = false;
                capybara.classList.add("running");
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            function endGame() {
                isGameOver = true;
                isRunning = false;
                capybara.classList.remove("running");
                if (score > highScore) {
                    highScore = score;
                    highScoreDisplay.innerText = highScore;
                    saveHighScore();
                }
                gameOverScreen.style.display = "block";
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            }

            function resetGame() {
                obstacles.forEach(o => o.element.remove());
                obstacles = [];
                score = 0;
                gameSpeed = 6.5;
                spawnTimer = 0;
                nextSpawnAt = 70;
                positionY = GROUND_Y;
                velocityY = 0;
                isHoldingJump = false;
                scoreDisplay.innerText = "0";
                gameOverScreen.style.display = "none";
                isGameOver = false;
                capybara.style.bottom = GROUND_Y + "px";
                startGame();
            }
        })();
    </script>
</body>
